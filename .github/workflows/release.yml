name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.mjs && node --check public/app.js && node --check public/i18n.js

      - name: Build zip package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="pi-web-console-${VERSION}/" HEAD -o "pi-web-console-v${VERSION}.zip"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: pi-web-console-v*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
